services:
  - type: web
    name: devmarket-backend
    runtime: python
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: devmarket-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"

databases:
  - name: devmarket-db
    plan: free
