# Staging environment blueprint — separate from production
# Deploy via Render Dashboard → Blueprints → New Blueprint → select this file
# This creates an isolated staging backend + staging database

services:
  - type: web
    name: devmarket-backend-staging
    runtime: python
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application
    # Track the staging branch — will auto-deploy when staging is pushed
    branch: staging
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: devmarket-staging-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      # Staging frontend URL — Vercel preview URL (update after staging preview exists)
      # Vercel preview URLs follow pattern: https://<project>-<random>-username.vercel.app
      - key: SITE_URL
        value: https://frontend-preview-staging.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-preview-staging.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://frontend-preview-staging.vercel.app
      # Razorpay TEST MODE ONLY for staging
      - key: RAZORPAY_MODE
        value: "test"
      # Add these as sensitive env vars in Render dashboard (not in blueprint):
      # RAZORPAY_KEY_ID=rzp_test_...
      # RAZORPAY_KEY_SECRET=...
      # RAZORPAY_WEBHOOK_SECRET=... (for staging webhook)
      # EMAIL_HOST_USER=...
      # EMAIL_HOST_PASSWORD=...
      # WHATSAPP_ACCESS_TOKEN=...
      # WHATSAPP_PHONE_NUMBER_ID=...
      # WHATSAPP_ADMIN_NUMBER=...
      # Seed data on first deploy
      - key: SEED_INITIAL_DATA
        value: "true"

databases:
  - name: devmarket-staging-db
    plan: free
