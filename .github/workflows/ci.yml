name: CI

on:
  pull_request:
  push:
    branches:
      - feature/complete-website-redesign
      - staging

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend — Django checks & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Test-only values — never real secrets. DEBUG=False exercises the
      # production code path; SECRET_KEY is required when DEBUG is off.
      DJANGO_SECRET_KEY: ci-test-secret-key-not-real
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests (test database is created automatically)
        run: python manage.py test apps
