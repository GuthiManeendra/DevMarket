services:
  - type: web
    name: devmarket-backend
    runtime: python
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: devmarket-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      # Public frontend origin — used for CORS, CSRF and the XML sitemap.
      # Update if the Vercel production domain changes.
      - key: SITE_URL
        value: https://frontend-nine-green-23.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-nine-green-23.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://frontend-nine-green-23.vercel.app

databases:
  - name: devmarket-db
    plan: free
